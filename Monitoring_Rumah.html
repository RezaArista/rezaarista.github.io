<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Monitoring KOS + CCTV</title>
    <style>
        /* Menghilangkan margin dan scrollbar ganda agar tampil layar penuh */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0f172a; /* Warna latar gelap saat loading awal */
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbxFT3GjHK87dZ9TFO0wgxF2NvGoc_2h9kihrmeP8qvXTHM7vqXRijzzUrSVH1wpUPzJpA/exec" 
        allow="geolocation; microphone; camera">
    </iframe>

</body>
</html>
